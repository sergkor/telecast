[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telecast"
version = "0.1.0"
description = "Telegram video article repurposing pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.21",
    "telethon>=1.36",
    "google-genai>=1.0",
    "httpx>=0.27",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "tenacity>=9.0",
    "loguru>=0.7",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
telecast = "telecast.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["telecast"]

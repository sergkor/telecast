<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Telecast{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1a1a1a; }
    header { background: #1f2430; color: #fff; padding: .7rem 1.2rem; display: flex; gap: 1rem; align-items: center; }
    header a { color: #cfd6e4; text-decoration: none; }
    main { max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; }
    .card { background: #fff; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .chip { display: inline-block; padding: .1rem .55rem; border-radius: 999px; font-size: .78rem; background: #e5e8ef; }
    .chip.PUBLISHED { background: #d3f2d9; } .chip.FAILED { background: #f8d5d5; }
    .chip.PUBLISHING, .chip.APPROVED { background: #fdeeba; } .chip.SKIPPED { background: #e5e8ef; }
    textarea { width: 100%; min-height: 10rem; font: inherit; }
    input[type=text], input[type=password] { width: 100%; font: inherit; padding: .3rem; box-sizing: border-box; }
    button { cursor: pointer; padding: .35rem .8rem; border-radius: 6px; border: 1px solid #b9c0cc; background: #fff; }
    button.primary { background: #2456d6; border-color: #2456d6; color: #fff; }
    .error { color: #b00020; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    video { max-width: 100%; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: .45rem .6rem; text-align: left; border-bottom: 1px solid #e5e8ef; }
  </style>
</head>
<body>
<header>
  <strong>Telecast</strong>
  <a href="/">Queue</a>
  <a href="/settings">Settings</a>
  <form method="post" action="/logout" style="margin-left:auto">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button>Log out</button>
  </form>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
